networks:
  monitor-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.19.0.0/16
          gateway: 172.19.0.1

services:
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      monitor-net:
        ipv4_address: 172.19.0.10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      monitor-net:
        ipv4_address: 172.19.0.20
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 5s
      timeout: 3s
      retries: 5

  monitor-ipv4-tool:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: monitor-server
    environment:
      - DOTNET_ENVIRONMENT=Production
    networks:
      - monitor-net
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      firebase-worker:
        condition: service_started

  firebase-worker:
    build:
      context: .
      dockerfile: firebase-worker/Dockerfile
    container_name: firebase-worker
    environment:
      - DOTNET_ENVIRONMENT=Production
    networks:
      monitor-net:
        ipv4_address: 172.19.0.30
    depends_on:
      rabbitmq:
        condition: service_healthy
